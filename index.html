<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1117" />
    <title>hungryvar</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS has no manifest support: standalone mode, the status bar treatment
         and the home-screen icon all have to be declared here. black-translucent
         lets the app paint under the status bar, which the dark background
         already covers. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="hungryvar" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS rounds the corners itself, so these are full-bleed squares. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registration lives here, not in the bundle. He deploys constantly, and
         if a build ever throws before its own registration code runs, the app
         would be stuck with no way to pull the fix. Keeping it outside the
         module means a white-screen build still updates itself. -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        if (location.hostname === "localhost") return;   // dev server is always fresh

        function start() {
          navigator.serviceWorker.register("/sw.js").then(function (reg) {
            // A waiting worker means a newer build is already downloaded; tell
            // it to take over instead of sitting there until every tab closes.
            function promote() { if (reg.waiting) reg.waiting.postMessage("skip-waiting"); }
            promote();
            reg.addEventListener("updatefound", function () {
              var sw = reg.installing;
              if (!sw) return;
              sw.addEventListener("statechange", function () {
                if (sw.state === "installed") promote();
              });
            });

            // Check on launch, and again on every return to the app — reopening
            // from the home screen resumes rather than reloads.
            reg.update().catch(function () {});
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") reg.update().catch(function () {});
            });
          }).catch(function () {});

          // Reload only when an OLD worker is replaced. On a first install there
          // was no controller, and reloading then is a pointless flash.
          var had = Boolean(navigator.serviceWorker.controller), reloading = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (!had || reloading) return;
            reloading = true;
            location.reload();
          });
        }

        // Waiting on `load` alone is a trap: on a cached load it has already
        // fired by the time this runs, and the listener never gets called.
        if (document.readyState === "complete") start();
        else window.addEventListener("load", start, { once: true });
      })();
    </script>
  </body>
</html>
